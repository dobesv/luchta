nextest-version = "0.9.99"
experimental = ["wrapper-scripts"]

# Cap concurrency for the process-spawning end-to-end tests. They spawn real
# processes and wait on filesystem events against a ~10s deadline; under
# full CPU-count parallelism the contention occasionally pushes one past the
# deadline and it fails as a bare timeout (see issue #352). Throttling this
# group to 4 concurrent tests reduces that contention while the other ~1660
# tests keep running at full speed. This mitigates the CPU-contention failure
# mode; it does not change the tests' own timing behaviour.
#
# max-threads = 4: matches the vCPU count of typical CI runners (so the cap is
# effectively a no-op there) while meaningfully cutting parallel load on
# higher-core dev machines, where the timeouts actually showed up.
[test-groups]
watch-e2e = { max-threads = 4 }

[scripts.wrapper.hermetic-unix]
command = { command-line = "scripts/nextest-hermetic.sh", relative-to = "workspace-root" }
target-runner = "within-wrapper"

[scripts.wrapper.hermetic-windows]
command = { command-line = "scripts/nextest-hermetic.cmd", relative-to = "workspace-root" }
target-runner = "within-wrapper"

[[profile.default.scripts]]
filter = "all()"
platform = { host = "cfg(unix)" }
run-wrapper = "hermetic-unix"

[[profile.default.scripts]]
filter = "all()"
platform = { host = "cfg(windows)" }
run-wrapper = "hermetic-windows"

# Assign the process-spawning e2e tests to the throttled watch-e2e group.
# `binary_id(...)` targets whole test binaries; the driver_e2e tests live in
# the `luchta-cli` bin binary alongside fast unit tests, so those are selected
# by a module-path pattern (`test(/driver_e2e/)` matches the test path
# `driver::driver_e2e_tests::*`) instead. Verify with:
#   cargo nextest list -E '<filter>'
[[profile.default.overrides]]
filter = 'binary_id(luchta-worker-watcher::e2e) + binary_id(luchta-cli::worker_integration) + (package(luchta-cli) & test(/driver_e2e/))'
test-group = "watch-e2e"
