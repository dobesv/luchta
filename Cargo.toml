[workspace]
# Deliberately "2", not "3". Resolver 3 would cap resolution at the declared
# `rust-version` floor, which sounds safer but silently inverts the intent of
# a "bump everything to latest" pass: it would resolve older, MSRV-compliant
# versions instead of the ones actually requested. The tradeoff this way is
# that `cargo update` can pull in a crate whose MSRV exceeds the workspace
# floor (it happened twice bumping deps in 2026-09) — that has to be caught by
# checking each updated crate's declared MSRV by hand, not by trusting a clean
# `cargo build` under the current toolchain.
resolver = "2"
members = [
    "crates/luchta-lockfile-version",
    "crates/luchta-types",
    "crates/luchta-glob",
    "crates/luchta-lockfiles",
    "crates/luchta-test-support",
    "crates/luchta-workspace",
    "crates/luchta-engine",
    "crates/luchta-worker",
    "crates/luchta-cli",
    "crates/luchta-yarn-worker",
    "crates/luchta-yarn-env",
    "crates/luchta-bash-worker",
    "crates/luchta-extra-resolve-worker",
    "crates/luchta-lazy-worker",
    "crates/luchta-worker-watcher",
    "crates/luchta-file-exists-filter",
    "crates/luchta-yarn-filter",
    "crates/luchta-command-filter",
    "crates/luchta-cache",
    "crates/luchta-ast-grep-worker",
    "crates/luchta-oxlint-worker",
    "crates/luchta-oxc-transform-worker",
    "crates/luchta-tsrs-worker",
    "crates/luchta-swc-transform-worker",
    "crates/luchta-oxfmt-worker",
    "xtask",
]

[workspace.package]
edition = "2021"
version = "0.3.8"
license = "MIT"
authors = ["Luchta Contributors"]
# Rust 1.99 required by tsrs at pinned rev cb2d7948f3686cba8448963a5147b0840bb53e5e,
# which is the binding constraint. OXC at pinned rev
# fa492d66e0df5d88ef68cf4c20d40f676611e547 requires Rust >= 1.97.0.
rust-version = "1.99"
repository = "https://example.com/luchta"
homepage = "https://example.com/luchta"
description = "Rust monorepo build orchestration tool"

# `oxc_formatter_css` pulls the registry `oxc-css-parser`, which depends on the
# registry `oxc_allocator`. Without this patch Cargo builds two distinct
# `oxc_allocator` crates and `oxc_formatter_css` fails to compile with an
# allocator type mismatch. This patch forces the git `oxc_allocator` (same rev
# as the other oxc crates) workspace-wide. Keep this rev in sync whenever the
# oxc git rev is bumped.
# Renovate's Cargo manager skips patches; the custom regex manager in
# renovate.json tracks this entry as part of the OXC toolchain group.
[patch.crates-io]
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547", package = "oxc_allocator" }

# tsrs_core pins unicode-id-start =1.1.2, but SWC requires ^1.2.0. This fork
# relaxes that constraint; identifiers may include newer Unicode 16/17 characters.
# Rebase the fork on the upstream revision below whenever tsrs is bumped.
[patch."https://github.com/oxc-project/tsrs.git"]
tsrs_core = { git = "https://github.com/dobesv/tsrs.git", rev = "b16b8c00e7a3cb3b33727d488df76fb26d7fd5da" }

[workspace.dependencies]
petgraph = "0.8.3"
tokio = { version = "1.38.0", features = ["full"] }
futures = "0.3.30"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
serde_norway = "0.9.42"
toml = "1.1.6"
thiserror = "2.0.20"
miette = { version = "7.2.0", features = ["fancy"] }
clap = { version = "4.5.7", features = ["derive"] }
globset = "0.4.14"
walkdir = "2.5.0"
blake3 = "1.5.1"
pnp = "0.12.12"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
gix = { version = "0.90.0", default-features = false, features = ["dirwalk", "status", "revision", "blob-diff", "sha1"] }
bincode = { version = "2.0.1", features = ["serde"] }
yarn-lock-parser = "0.14.0"
assert_cmd = "2.0.14"
assert_fs = "1.1.1"
predicates = "3.1.0"
tempfile = "3.10.1"
libc = "0.2.155"
windows-sys = "0.61"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
# Only luchta-cli's macOS/Windows process-tree RSS walk (src/rss.rs) calls
# sysinfo; Linux reads /proc. A breaking bump passes every Linux build and test
# and fails only CI's `Check (macos-latest)` and `Check (windows-latest)`.
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
zstd = "0.14.0"
tar = "0.4.44"
dirs = "7.0.0"
fd-lock = "4"
fs2 = "0.4.3"
ignore = "0.4.27"
notify = "9.0.0-rc.5"
notify-debouncer-full = "0.8.0-rc.2"
# Plain `mimalloc` rather than oxlint's `mimalloc-safe`: the latter builds via
# cmake, which we don't want to require of every build environment.
mimalloc = "0.1.43"

# oxc toolchain pinned to a single main rev fa492d66e0df5d88ef68cf4c20d40f676611e547
# (oxc 0.158.0). Requires Rust >= 1.97.
# The git pin is mandatory, not a style choice: oxc_linter, oxc_formatter_core
# and oxc_formatter_css are not published to crates.io at all, and every
# published oxc_formatter version on crates.io is yanked. "Just use the
# released crates" is not an available option for this workspace.
#
# Keep every oxc git dependency, including `[patch.crates-io]`, at one rev.
# `xtask::tests::oxc_git_dependencies_share_one_revision` guards this.
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547" }
oxc_parser = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547" }
oxc_linter = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547" }
oxc_span = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547" }
oxc_syntax = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547" }
oxc_transformer = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547" }
oxc_codegen = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547" }
oxc_sourcemap = "10.0.0"
oxc_formatter = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547" }
oxc_formatter_css = { git = "https://github.com/oxc-project/oxc.git", rev = "fa492d66e0df5d88ef68cf4c20d40f676611e547", default-features = false }
json-strip-comments = "3.1.1"
serde-sarif = "0.8.0"
url = "2.5.8"

# tsrs crates are unpublished. Keep all crates at this exact upstream revision.
tsrs_ast = { git = "https://github.com/oxc-project/tsrs.git", rev = "cb2d7948f3686cba8448963a5147b0840bb53e5e" }
tsrs_compiler = { git = "https://github.com/oxc-project/tsrs.git", rev = "cb2d7948f3686cba8448963a5147b0840bb53e5e" }
tsrs_core = { git = "https://github.com/oxc-project/tsrs.git", rev = "cb2d7948f3686cba8448963a5147b0840bb53e5e" }
tsrs_diagnostics = { git = "https://github.com/oxc-project/tsrs.git", rev = "cb2d7948f3686cba8448963a5147b0840bb53e5e" }
tsrs_module = { git = "https://github.com/oxc-project/tsrs.git", rev = "cb2d7948f3686cba8448963a5147b0840bb53e5e" }
tsrs_tsoptions = { git = "https://github.com/oxc-project/tsrs.git", rev = "cb2d7948f3686cba8448963a5147b0840bb53e5e" }
tsrs_vfs = { git = "https://github.com/oxc-project/tsrs.git", rev = "cb2d7948f3686cba8448963a5147b0840bb53e5e" }

# swc pinned exact — SWC breaks public API on minor bumps. See plan note a394e139 (probe).
swc_core = { version = "=80.0.1", features = ["base_module", "common", "ecma_ast", "ecma_parser", "ecma_helpers_inline"] }
styled_components = "=18.0.0"

# Match oxlint's own release settings (fat LTO, one codegen unit) so the
# bundled oxc crates run at full speed; without this the workers lint
# noticeably slower than the native oxlint binary. `panic = "abort"` is
# deliberately NOT set: workers are persistent processes that must survive a
# panicking job (panics are caught at spawn_blocking/JoinSet boundaries).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
