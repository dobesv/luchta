[package]
name = "luchta-oxfmt-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[features]
default = ["oxc"]
oxc = [
    "dep:ignore",
    "dep:json-strip-comments",
    "dep:oxc_allocator",
    "dep:oxc_formatter",
    "dep:oxc_formatter_core",
    "dep:oxc_formatter_css",
    "dep:oxc_span",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
luchta-worker = { path = "../luchta-worker" }
tokio = { workspace = true }
ignore = { workspace = true, optional = true }
json-strip-comments = { workspace = true, optional = true }
oxc_allocator = { workspace = true, optional = true }
oxc_formatter = { workspace = true, optional = true }
oxc_formatter_core = { workspace = true, optional = true }
oxc_formatter_css = { workspace = true, optional = true }
oxc_span = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# mimalloc as the global allocator — see luchta-oxlint-worker/Cargo.toml for
# the rationale and target gating notes.
[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_arch = "arm", target_arch = "riscv64", target_family = "wasm")))'.dependencies]
mimalloc = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_arch = "arm"), not(target_arch = "riscv64")))'.dependencies]
mimalloc = { workspace = true, features = ["local_dynamic_tls"] }

[dev-dependencies]
assert_fs = { workspace = true }
