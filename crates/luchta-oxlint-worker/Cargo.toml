[package]
name = "luchta-oxlint-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[features]
default = ["oxc"]
oxc = [
    "dep:ignore",
    "dep:oxc_allocator",
    "dep:oxc_parser",
    "dep:oxc_semantic",
    "dep:oxc_linter",
    "dep:oxc_span",
    "dep:oxc_diagnostics",
    "dep:oxc_syntax",
    "dep:serde",
    "dep:serde_json",
    "dep:url",
]

[dependencies]
luchta-worker = { path = "../luchta-worker" }
tokio = { workspace = true }
ignore = { workspace = true, optional = true }
oxc_allocator = { workspace = true, optional = true }
oxc_parser = { workspace = true, optional = true }
oxc_semantic = { workspace = true, optional = true }
oxc_linter = { workspace = true, optional = true }
oxc_span = { workspace = true, optional = true }
oxc_diagnostics = { workspace = true, optional = true }
oxc_syntax = { git = "https://github.com/oxc-project/oxc", rev = "415fe1e7bb423cf05019c5e2c9a5705eebbc5447", optional = true }
rustc-hash = "2.1.1"
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
url = { workspace = true, optional = true }

# mimalloc as the global allocator, with target gating modeled on oxlint's
# (apps/oxlint/Cargo.toml). oxc is allocation-heavy outside its arena; the
# system allocator (especially musl's, used by the Linux release targets) is
# markedly slower under rayon parallelism. `local_dynamic_tls` avoids TLS
# crashes in static/musl builds.
[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_arch = "arm", target_arch = "riscv64", target_family = "wasm")))'.dependencies]
mimalloc = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_arch = "arm"), not(target_arch = "riscv64")))'.dependencies]
mimalloc = { workspace = true, features = ["local_dynamic_tls"] }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_fs = { workspace = true }
luchta-engine = { path = "../luchta-engine" }
serde_json = { workspace = true }
tempfile = { workspace = true }
